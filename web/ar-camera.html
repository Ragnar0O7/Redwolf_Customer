<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>View in your space – RedWolf Media</title>
<style>
  :root { --red: #ED1F24; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: Roboto, system-ui, sans-serif; touch-action: none; user-select: none; }
  #cam, #gl { position: fixed; inset: 0; width: 100%; height: 100%; }
  #cam { object-fit: cover; }
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background: linear-gradient(rgba(0,0,0,.55), transparent); }
  .top h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff;
    display: grid; place-items: center; font-size: 20px; cursor: pointer; }
  .chip { border: 0; border-radius: 16px; padding: 6px 12px; background: rgba(0,0,0,.45); color: #fff; font-size: 13px; }
  .hint { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 72px); transform: translateX(-50%);
    width: max-content; max-width: 88vw; padding: 8px 14px; border-radius: 18px; background: rgba(0,0,0,.55);
    font-size: 13px; text-align: center; transition: opacity .4s; }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 24px calc(env(safe-area-inset-bottom) + 24px);
    background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .modes { display: flex; justify-content: center; gap: 24px; margin-bottom: 16px; }
  .modes button { border: 0; background: none; color: rgba(255,255,255,.7); font: 600 14px Roboto, sans-serif;
    letter-spacing: .5px; padding: 4px 2px; }
  .modes button.on { color: #fff; border-bottom: 2px solid var(--red); }
  .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .thumb { width: 52px; height: 52px; border-radius: 12px; border: 2px solid #fff; background: #222 center/cover;
    padding: 0; justify-self: start; position: relative; }
  .thumb span { position: absolute; top: -8px; right: -8px; min-width: 20px; height: 20px; border-radius: 10px;
    background: var(--red); font-size: 12px; line-height: 20px; padding: 0 5px; }
  .shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 5px; }
  .shutter i { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: all .2s; }
  .shutter.video i { background: var(--red); }
  .shutter.rec i { border-radius: 8px; transform: scale(.55); }
  .reset { justify-self: end; }
  .timer { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 72px); transform: translateX(-50%);
    padding: 6px 12px; border-radius: 14px; background: var(--red); font: 600 14px Roboto, sans-serif; display: none; }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .msg { position: fixed; inset: 0; display: none; place-items: center; padding: 32px; text-align: center; background: #111; }
  .msg div { max-width: 320px; } .msg p { color: #ccc; line-height: 1.5; }
  .msg button, .sheet .act button { border: 0; border-radius: 8px; padding: 12px 20px; background: var(--red); color: #fff; font: 600 15px Roboto, sans-serif; }
  .sheet { position: fixed; inset: 0; background: #111; display: none; flex-direction: column; }
  .sheet header { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; }
  .sheet header h2 { flex: 1; margin: 0; font-size: 17px; font-weight: 500; }
  .grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; align-content: start; touch-action: pan-y; }
  .grid button { aspect-ratio: 9/16; border: 0; padding: 0; background: #222 center/cover; position: relative; }
  .grid button em { position: absolute; left: 6px; bottom: 6px; font-style: normal; font-size: 12px; background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 6px; }
  .empty { color: #888; text-align: center; grid-column: 1/-1; padding: 48px 16px; }
  .viewer { flex: 1; display: grid; place-items: center; min-height: 0; }
  .viewer img, .viewer video { max-width: 100%; max-height: 100%; }
  .sheet .act { display: flex; gap: 12px; justify-content: center; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); }
  .sheet .act .ghost { background: #333; }
  .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 10px 16px; border-radius: 18px; background: rgba(0,0,0,.6); font-size: 14px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
  <div class="flash" id="flash"></div>

  <div class="top">
    <button class="icon" id="back" aria-label="Back">&larr;</button>
    <h1 id="title">View in your space</h1>
    <button class="chip" id="scale">100%</button>
  </div>
  <div class="hint" id="hint">Drag to place on the floor · pinch to resize · twist to rotate</div>
  <div class="timer" id="timer">● 00:00</div>
  <div class="loading" id="loading">Loading 3D model…</div>

  <div class="bottom">
    <div class="modes"><button id="mPhoto" class="on">PHOTO</button><button id="mVideo">VIDEO</button></div>
    <div class="row">
      <button class="thumb" id="thumb" aria-label="Gallery"></button>
      <button class="shutter" id="shutter" aria-label="Take photo"><i></i></button>
      <button class="chip reset" id="recenter">Re-centre</button>
    </div>
  </div>

  <div class="sheet" id="gallery">
    <header><button class="icon" id="gClose" aria-label="Close">&larr;</button><h2>Gallery</h2></header>
    <div class="grid" id="grid"></div>
  </div>
  <div class="sheet" id="viewer">
    <header><button class="icon" id="vClose" aria-label="Close">&larr;</button><h2 id="vTitle">Photo</h2></header>
    <div class="viewer" id="vBody"></div>
    <div class="act"><button id="vShare">Share</button><button id="vSave" class="ghost">Save</button><button id="vDel" class="ghost">Delete</button></div>
  </div>

  <div class="msg" id="msg"><div><h2 id="msgT">Camera needed</h2><p id="msgP"></p><button id="msgB">Try again</button></div></div>

<script type="module" src="ar-camera.js"></script>
</body>
</html>
