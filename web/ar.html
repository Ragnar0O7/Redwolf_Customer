<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View in your space – RedWolf Media</title>
  <!-- Standalone AR page, set up like modelviewer.dev. Chrome's WebXR AR did not
       render inside the Flutter page on some phones; outside it, it does. -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: Roboto, system-ui, sans-serif; }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center;
      gap: 8px; padding: 12px 16px; background: rgba(255,255,255,.92); }
    header button { border: 0; background: none; font-size: 24px; line-height: 1; padding: 4px 8px 4px 0; cursor: pointer; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    model-viewer { width: 100%; height: 100%; --progress-bar-color: #ED1F24; }
    .ar-button { position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); border: 0;
      border-radius: 8px; padding: 14px 24px; background: #ED1F24; color: #fff; font: 600 16px Roboto, sans-serif;
      white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
    .note { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); width: max-content;
      max-width: 85vw; padding: 10px 16px; border-radius: 20px; background: rgba(0,0,0,.72); color: #fff;
      font-size: 14px; line-height: 1.35; text-align: center; display: none; }
    #loading { display: block; }
    model-viewer[ar-status="session-started"] > #scan,
    model-viewer[ar-tracking="not-tracking"] > #scan { display: block; bottom: 72px; }
  </style>
</head>
<body>
  <header>
    <button type="button" aria-label="Back" onclick="history.length > 1 ? history.back() : (location.href = '/')">&larr;</button>
    <h1 id="title">View in your space</h1>
  </header>
  <model-viewer id="viewer" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor"
      camera-controls touch-action="pan-y" shadow-intensity="1" alt="3D model of the product">
    <button slot="ar-button" class="ar-button">View in your space</button>
    <div class="note" id="loading">Loading 3D model…</div>
    <div class="note" id="scan">Point your phone at the floor and move it slowly side to side</div>
    <div class="note" id="error"></div>
  </model-viewer>
  <script>
    const params = new URLSearchParams(location.search);
    const viewer = document.getElementById('viewer');
    const src = params.get('src') || '';
    const show = (id, text) => {
      for (const n of document.querySelectorAll('.note:not(#scan)')) n.style.display = 'none';
      if (id) { const n = document.getElementById(id); if (text) n.textContent = text; n.style.display = 'block'; }
    };
    // Only our own storage, so this page can't be used to show arbitrary files.
    let ok = false;
    // modelviewer.dev: Google's sample models, for A/B testing a phone.
    try { ok = ['https://zsipfgtlfnfvmnrohtdo.supabase.co', 'https://modelviewer.dev', location.origin].includes(new URL(src, location.href).origin); } catch (_) {}
    // ?modes=scene-viewer forces Google's AR viewer (A/B test).
    if (params.get('modes') === 'scene-viewer') viewer.setAttribute('ar-modes', 'scene-viewer');
    if (ok) {
      viewer.src = src;
      const title = params.get('title');
      if (title) { document.getElementById('title').textContent = title; viewer.alt = '3D model of ' + title; }
    } else {
      show('error', 'This product has no 3D model.');
    }
    viewer.addEventListener('load', () => show(null));
    viewer.addEventListener('error', () => show('error', 'The 3D model could not load. Check your connection and reload.'));
    viewer.addEventListener('ar-status', (e) => {
      if (e.detail.status === 'failed') show('error', 'AR could not start on this phone. Tap "View in your space" to try again.');
    });
  </script>
</body>
</html>
